version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      lint:
        patterns:
          - 'eslint*'
          - 'prettier'
          - 'stylelint*'
          - 'typescript-eslint'
      test:
        patterns:
          - 'vitest'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

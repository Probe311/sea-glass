name: Feature request
description: Propose a component, token, or DX improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What gap does this fill vs demo / ROADMAP?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: API sketch, material props, a11y notes
    validations:
      required: true

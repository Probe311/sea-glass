name: Bug report
description: Something is broken in Sea Glass
labels: [bug]
body:
  - type: textarea
    id: describe
    attributes:
      label: What happened?
      description: Steps to reproduce, expected vs actual
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: Browser, OS, package version
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / recording

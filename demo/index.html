    padding: 1.25rem;
    border-radius: 20px;
    background: linear-gradient(160deg, #7ec8c0 0%, #3a8f9a 45%, #1e4d5c 100%);
  }
  .sg-demo-catalog .stack { display: grid; gap: 12px; }
  .sg-demo-catalog .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
</style>

<script type="module">
  const v = window.SG_META?.react || '19.3.0';
  const React = (await import(`https://esm.sh/react@${v}`)).default;
  const ReactDOM = (await import(`https://esm.sh/react-dom@${v}`)).default;
  const { createRoot } = await import(`https://esm.sh/react-dom@${v}/client`);
  window.React = React;
  window.ReactDOM = Object.assign({}, ReactDOM, { createRoot });
  const files = ['core.js', 'ui.js', 'ui2.js', 'sec-a.js', 'sec-b.js', 'sec-c.js'];
  for (const src of files) {
    await new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src;
      s.onload = resolve;
      s.onerror = () => reject(new Error('Failed to load ' + src));
      document.body.appendChild(s);
    });
  }
</script>
